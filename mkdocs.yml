site_name: pgEdge Starfleet (Preview)
use_directory_urls: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.superfences

theme:
  name: material
  favicon: img/favicon.ico
  logo_dark_mode: 'img/logo-dark.png'
  logo_light_mode: 'img/logo-light.png'

  features:
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

nav:
  - pgEdge Starfleet Managed Postgres:
    - Overview: index.md
  - Deploying a Managed Database:
    - managed/creating_managed.md
    - Selecting a Database Size: managed/sizes.md
  - Using the Database Console:
    - using_console/index.md
    - Monitoring System Metrics: using_console/metrics.md
    - Reviewing the Log Files: using_console/logs.md
    - Restoring from Backup: using_console/backups.md
    - Rotating Database Credentials: using_console/rotate_credentials.md
    - Reviewing the Activity Log: using_console/activity_log.md
    - Accessing Management Options with the Actions Menu: using_console/actions.md
  - Serving up AI Content:
    - Enabling and Using the MCP Server: serving_ai_content/mcp.md
    - Enabling and Using the RAG Server: serving_ai_content/rag.md
  - Connecting to a pgEdge Starfleet Database:
    - connecting/index.md
    - Connecting with the AI DBA Workbench: connecting/workbench.md
    - Connecting with psql: connecting/psql.md
    - Connecting with pgAdmin: connecting/pgadmin.md
  - Using Your Database:
    - Database Roles: using_database/roles.md
    - Loading Data into Your pgEdge Starfleet Database: using_database/loading_data.md
    - Installing Extensions: using_database/extensions.md
    - ORM and Framework Guides: using_database/orm_guides.md
  - Managing Account Settings: settings.md
  - Managing Team Members: team_management.md
  - Community: community.md
  - Docs: docs_link.md
