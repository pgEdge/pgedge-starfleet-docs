# The pgEdge console links to a handful of these pages, and its deploy fails
# if one is missing. This check moves that failure to the docs PR.
name: Console links

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/check-console-links.sh
