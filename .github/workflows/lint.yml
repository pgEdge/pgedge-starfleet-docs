# The 79-character wrap rule is markdownlint's MD013, which CodeRabbit
# ignores by design along with MD012 and the bare-URL rule. Without this
# job those rules hold only for contributors who ran `pre-commit
# install`, and a page edited in the GitHub web UI escapes them entirely.
name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The hooks that rewrite a file exit non-zero when they do, so the
      # diff is the whole error message.
      - name: Run the hooks
        run: |
          python3 -m pip install --quiet pre-commit
          pre-commit run --all-files --show-diff-on-failure
