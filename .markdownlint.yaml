# Read by the pre-commit hook, which the Lint check runs, and by
# CodeRabbit for the rules it does not ignore. MD013 and MD012 below
# are on CodeRabbit's ignore list, so Lint is what enforces them.
default: true

# The wrapping rule from CONTRIBUTING.md. MD013 already exempts a line
# with no whitespace past the limit, which covers a bare URL.
MD013:
  line_length: 79
  tables: false
  code_blocks: false

# Off because the tree was written this way throughout. Turning one on
# rewrites every page and changes nothing a reader sees. Only MD030
# and MD046 reach CodeRabbit; the rest matter to the local run alone.
MD004: false
MD007: false
MD030: false
MD046: false
MD060: false
